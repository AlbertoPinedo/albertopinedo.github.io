<style>
:root{
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --bg:#f4f6fb; --bg-2:#ffffff; --surface:rgba(255,255,255,.80); --surface-2:rgba(255,255,255,.96);
  --text:#0d1326; --muted:#55607a; --faint:#8790a6; --line:rgba(13,19,38,.10); --line-2:rgba(13,19,38,.18);
  --chip:rgba(13,19,38,.055); --chip-hover:rgba(13,19,38,.10); --chip-on:#0d1326; --chip-on-text:#ffffff;
  --shadow:0 1px 2px rgba(13,19,38,.05),0 10px 30px rgba(13,19,38,.07);
  --shadow-lg:0 24px 70px rgba(13,19,38,.20);
  --L:42%; --S:74%; --glow:.18; --grid:rgba(13,19,38,.045);
  --st-ga:#0f8a5f; --st-rolling:#0e7490; --st-preview:#6d28d9; --st-soon:#b45309; --st-announced:#64748b;
  --radius:18px; --maxw:1320px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060a16; --bg-2:#0a1023; --surface:rgba(16,23,47,.70); --surface-2:rgba(18,26,54,.97);
    --text:#eef2ff; --muted:#a7b1cd; --faint:#7b85a2; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
    --chip:rgba(255,255,255,.065); --chip-hover:rgba(255,255,255,.12); --chip-on:#eef2ff; --chip-on-text:#0a1023;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 34px rgba(0,0,0,.35); --shadow-lg:0 30px 90px rgba(0,0,0,.65);
    --L:68%; --S:86%; --glow:.30; --grid:rgba(255,255,255,.035);
    --st-ga:#34d399; --st-rolling:#22d3ee; --st-preview:#a78bfa; --st-soon:#fbbf24; --st-announced:#94a3b8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#060a16; --bg-2:#0a1023; --surface:rgba(16,23,47,.70); --surface-2:rgba(18,26,54,.97);
  --text:#eef2ff; --muted:#a7b1cd; --faint:#7b85a2; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --chip:rgba(255,255,255,.065); --chip-hover:rgba(255,255,255,.12); --chip-on:#eef2ff; --chip-on-text:#0a1023;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 34px rgba(0,0,0,.35); --shadow-lg:0 30px 90px rgba(0,0,0,.65);
  --L:68%; --S:86%; --glow:.30; --grid:rgba(255,255,255,.035);
  --st-ga:#34d399; --st-rolling:#22d3ee; --st-preview:#a78bfa; --st-soon:#fbbf24; --st-announced:#94a3b8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%)}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.skip{position:absolute;inset-inline-start:-999px;inset-block-start:8px;background:var(--chip-on);color:var(--chip-on-text);padding:8px 14px;border-radius:10px;z-index:100}
.skip:focus{inset-inline-start:12px}
:focus-visible{outline:2px solid hsl(212 90% 60%);outline-offset:2px;border-radius:8px}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:22px}
.c{--c:hsl(var(--h) var(--S) var(--L));--c-soft:hsl(var(--h) 85% 60% / .14);--c-line:hsl(var(--h) 85% 60% / .38)}

/* top bar */
.topbar{position:sticky;inset-block-start:0;z-index:40;background:var(--bg);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);background:color-mix(in srgb,var(--bg) 72%,transparent);border-block-end:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;text-decoration:none}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:conic-gradient(from 210deg,hsl(212 92% 58%),hsl(268 85% 62%),hsl(330 85% 60%),hsl(44 95% 55%),hsl(152 75% 45%),hsl(212 92% 58%));box-shadow:0 6px 18px hsl(268 85% 55% / .35)}
.logo svg{width:18px;height:18px}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none;padding-block:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 13px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background .2s,color .2s}
.tab svg{width:16px;height:16px}
.tab:hover{background:var(--chip);color:var(--text)}
.tab[aria-selected="true"]{background:var(--chip-on);color:var(--chip-on-text)}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);letter-spacing:.03em}
.seg button[aria-pressed="true"]{background:var(--bg-2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--chip-hover)}
.iconbtn svg{width:18px;height:18px}

/* hero */
.hero{position:relative;overflow:hidden;padding-block:64px 30px;isolation:isolate}
.aurora{position:absolute;inset:-30% -10% -10% -10%;z-index:-1;filter:blur(70px);opacity:var(--glow);pointer-events:none}
.aurora span{position:absolute;width:44vmax;height:44vmax;border-radius:50%;background:radial-gradient(circle at center,hsl(var(--h) 95% 58%),transparent 62%);animation:drift 26s ease-in-out infinite alternate}
.aurora span:nth-child(1){inset-block-start:-8%;inset-inline-start:-6%}
.aurora span:nth-child(2){inset-block-start:4%;inset-inline-start:30%;animation-duration:31s;animation-delay:-6s}
.aurora span:nth-child(3){inset-block-start:-12%;inset-inline-start:62%;animation-duration:29s;animation-delay:-12s}
.aurora span:nth-child(4){inset-block-start:30%;inset-inline-start:12%;animation-duration:35s;animation-delay:-3s}
.aurora span:nth-child(5){inset-block-start:26%;inset-inline-start:70%;animation-duration:33s;animation-delay:-9s}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6%,4%,0) scale(1.12)}100%{transform:translate3d(-5%,7%,0) scale(.95)}}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;backdrop-filter:blur(8px)}
.kicker .live{width:8px;height:8px;border-radius:50%;background:hsl(152 75% 45%);box-shadow:0 0 0 4px hsl(152 75% 45% / .2)}
.hero h1{font-family:var(--display);font-size:clamp(34px,5.4vw,68px);line-height:1.02;letter-spacing:-.035em;margin:18px 0 14px;max-width:16ch;font-weight:800}
.hero h1 .grad{background:linear-gradient(92deg,hsl(212 92% 56%),hsl(268 85% 62%) 45%,hsl(330 85% 60%) 75%,hsl(24 95% 56%));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{font-size:clamp(16px,1.6vw,19px);color:var(--muted);max-width:62ch;margin:0}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-block-start:30px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--display);font-size:clamp(24px,2.6vw,34px);letter-spacing:-.03em;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi.k-ga b{color:var(--st-ga)} .kpi.k-pv b{color:var(--st-preview)} .kpi.k-nx b{color:var(--st-soon)}

/* controls */
.controls{position:relative;z-index:5;padding-block:12px}
.controls .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding-inline:12px;min-height:40px}
.search svg{width:18px;height:18px;color:var(--faint);flex:none}
.search input{flex:1;border:0;background:transparent;outline:none;font:inherit;color:var(--text);min-width:0;padding-block:8px}
.search kbd{font:600 11px var(--font);color:var(--faint);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px}
.fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flabel{font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-inline-end:2px}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.chip:hover{background:var(--chip-hover);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-text)}
.chip .sw{width:8px;height:8px;border-radius:50%}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .2s;margin:0}
.toggle input::after{content:"";position:absolute;inset-block-start:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle input:checked{background:hsl(212 85% 52%)}
.toggle input:checked::after{transform:translateX(14px)}
[dir="rtl"] .toggle input:checked::after{transform:translateX(-14px)}
.bar .spacer{flex:1}
.count{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.btn{border:1px solid var(--line-2);background:transparent;border-radius:10px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--text);text-decoration:none}
.btn:hover{background:var(--chip)}
.btn svg{width:15px;height:15px}

/* sections */
main{padding-block:10px 40px;min-height:50vh}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-block:18px 16px}
.vhead h2{font-family:var(--display);font-size:clamp(22px,2.4vw,30px);letter-spacing:-.02em;margin:0}
.vhead p{margin:4px 0 0;color:var(--muted);max-width:75ch}
.pillar{margin-block:30px 8px}
.pillar-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-block-end:14px;padding-block-end:10px;border-block-end:1px dashed var(--line-2)}
.pillar-head .pn{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.pillar-head h3{margin:0;font-family:var(--display);font-size:22px;letter-spacing:-.02em}
.pillar-head p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}

/* idea card */
.icard{position:relative;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:12px;overflow:hidden;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s;backdrop-filter:blur(10px)}
.icard::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(320px circle at var(--mx,50%) var(--my,0%),hsl(var(--h) 90% 60% / .16),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.icard:hover::before{opacity:1}
.icard::after{content:"";position:absolute;inset:auto -30% -60% auto;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--c-soft),transparent 65%);transition:transform .4s;pointer-events:none}
.icard:hover{transform:translateY(-4px);border-color:var(--c-line);box-shadow:0 18px 40px hsl(var(--h) 80% 40% / .18)}
.icard:hover::after{transform:scale(1.35)}
.ihead{display:flex;align-items:center;gap:12px}
.ibubble{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 88% 56%),hsl(calc(var(--h) + 38) 85% 50%));box-shadow:0 10px 22px hsl(var(--h) 85% 45% / .35)}
.ibubble svg{width:24px;height:24px}
.icount{margin-inline-start:auto;text-align:end;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.icount small{display:block;font-family:var(--font);font-size:11px;font-weight:600;color:var(--faint);letter-spacing:0}
.icard h4{margin:0;font-family:var(--display);font-size:19px;line-height:1.2;letter-spacing:-.015em}
.icard .tag{margin:0;color:var(--muted);font-size:14.5px}
.sbar{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--chip)}
.sbar i{display:block;height:100%}
.sbar .ga{background:var(--st-ga)} .sbar .rolling{background:var(--st-rolling)} .sbar .preview{background:var(--st-preview)} .sbar .soon{background:var(--st-soon)} .sbar .announced{background:var(--st-announced)}
.imeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--faint);font-weight:600}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pchip b{color:var(--text);font-weight:700;margin-inline-start:4px}
.icard.empty{opacity:.45}
.ideastrip{display:flex;flex-wrap:wrap;gap:6px 4px;margin-block-start:18px}
.ideastrip .ichip{background:var(--surface);backdrop-filter:blur(8px);margin:0}
.ideastrip .ichip:hover{background:var(--c-soft)}

/* idea detail */
.ideahero{position:relative;border-radius:26px;padding:28px;overflow:hidden;border:1px solid var(--c-line);background:linear-gradient(135deg,hsl(var(--h) 85% 55% / .16),hsl(calc(var(--h) + 40) 85% 55% / .06) 60%,transparent),var(--surface);box-shadow:var(--shadow)}
.ideahero .bigicon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 88% 56%),hsl(calc(var(--h) + 38) 85% 50%));box-shadow:0 14px 30px hsl(var(--h) 85% 45% / .4)}
.ideahero .bigicon svg{width:34px;height:34px}
.ideahero .top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ideahero h2{font-family:var(--display);font-size:clamp(26px,3.2vw,40px);letter-spacing:-.03em;margin:6px 0 4px;line-height:1.08}
.ideahero .tagl{font-size:18px;color:var(--text);opacity:.85;margin:0}
.ideahero .desc{color:var(--muted);max-width:90ch;margin:14px 0 0;font-size:15.5px}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);background:none;border:0;cursor:pointer;padding:0;margin-block-end:8px}
.crumb:hover{color:var(--text)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-block-start:18px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-family:var(--display);font-size:24px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-block:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.panel h5{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ichip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--c-line);background:var(--c-soft);color:var(--text);border-radius:999px;padding:4px 10px 4px 6px;font-size:13px;font-weight:600;cursor:pointer;margin:0 6px 6px 0}
.ichip i{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;background:var(--c);color:#fff}
.ichip i svg{width:12px;height:12px}
.ichip b{font-weight:800;color:var(--c)}

/* announcement card */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;backdrop-filter:blur(10px)}
.card::before{content:"";position:absolute;inset-block:14px;inset-inline-start:0;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.card:hover{transform:translateY(-2px);border-color:var(--c-line);box-shadow:0 14px 34px hsl(var(--h) 80% 40% / .14)}
.card.is-conn{border-style:dashed}
.card-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.pill.st-ga{color:var(--st-ga)} .pill.st-rolling{color:var(--st-rolling)} .pill.st-preview{color:var(--st-preview)} .pill.st-soon{color:var(--st-soon)} .pill.st-announced{color:var(--st-announced)}
.pill.ext{color:var(--faint);border-style:dashed}
.badge-conn{font-size:11px;font-weight:700;color:var(--faint);border:1px dashed var(--line-2);border-radius:999px;padding:2px 8px}
mark{background:hsl(48 100% 60% / .55);color:inherit;border-radius:3px;padding:0 1px}

/* constellation */
.const-wrap{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.const-wrap svg{display:block;width:100%;height:auto;max-height:82vh}
.edge{fill:none;stroke:hsl(var(--h) 80% 60%);stroke-opacity:.22;transition:stroke-opacity .2s}
svg.hovering .edge{stroke-opacity:.05}
svg.hovering .edge.on{stroke-opacity:.85}
.node{cursor:pointer}
.node .halo{fill:hsl(var(--h) 85% 55% / .14);transition:r .25s}
.node .core{fill:hsl(var(--h) 85% 52%);stroke:var(--bg-2);stroke-width:3}
.node .ic{stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.node:hover .halo,.node:focus .halo,.node.on .halo{fill:hsl(var(--h) 85% 55% / .28)}
.node:focus{outline:none}
.node:focus-visible .core{stroke:hsl(212 90% 60%);stroke-width:4}
.nlabel{font:700 13px var(--font);fill:var(--text);paint-order:stroke;stroke:var(--bg-2);stroke-width:4px;stroke-linejoin:round}
.ncount{font:600 11px var(--font);fill:var(--muted);paint-order:stroke;stroke:var(--bg-2);stroke-width:4px}
.plabel{font:800 11px var(--font);letter-spacing:.18em;fill:var(--faint);text-transform:uppercase}
.dot{cursor:pointer;transition:opacity .2s,r .15s}
.dot.ga{fill:hsl(var(--h) var(--S) var(--L))}
.dot.rolling{fill:hsl(var(--h) var(--S) var(--L));fill-opacity:.7}
.dot.preview{fill:var(--bg-2);stroke:hsl(var(--h) var(--S) var(--L));stroke-width:2}
.dot.soon,.dot.announced{fill:var(--bg-2);stroke:hsl(var(--h) var(--S) var(--L));stroke-width:1.6;stroke-dasharray:2 2}
.dot:hover{r:8}
.dot.dim{opacity:.12}
svg.hovering .dot{opacity:.25}
svg.hovering .dot.on{opacity:1}
svg.hovering .dot.on.dim{opacity:.3}
.center-t{font:800 40px var(--display);fill:var(--text);letter-spacing:-.04em}
.center-s{font:700 12px var(--font);fill:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:16px;padding:12px 18px;border-block-start:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:600;align-items:center}
.legend svg{width:14px;height:14px;vertical-align:-2px;margin-inline-end:6px}
.tip{position:fixed;z-index:80;pointer-events:none;max-width:320px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);border-radius:12px;padding:9px 12px;font-size:13px;box-shadow:var(--shadow-lg)}
.tip b{display:block;font-size:13.5px;margin-block-end:2px}
.tip span{color:var(--muted);font-size:12px}

/* matrix */
.mtable-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
table.mtable{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-size:13px}
.mtable th,.mtable td{padding:8px 8px;text-align:center;border-block-end:1px solid var(--line)}
.mtable thead th{position:sticky;inset-block-start:0;background:var(--surface-2);font-size:11.5px;color:var(--muted);font-weight:700;vertical-align:bottom;z-index:1}
.mtable th.rowh{text-align:start;white-space:nowrap;position:sticky;inset-inline-start:0;background:var(--surface-2);z-index:2;font-weight:700}
.mtable th.rowh button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.mtable th.rowh i{width:10px;height:10px;border-radius:3px;background:hsl(var(--h) var(--S) var(--L))}
.mtable tr.prow th{background:var(--chip);text-align:start;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800}
.cellbtn{all:unset;box-sizing:border-box;display:block;min-width:44px;height:34px;line-height:34px;border-radius:10px;cursor:pointer;font-weight:800;text-align:center;transition:transform .15s}
.cellbtn:hover{transform:scale(1.08)}
.cellbtn:focus-visible{outline:2px solid hsl(212 90% 60%);outline-offset:2px}
.cellbtn.zero{color:var(--faint);opacity:.35;cursor:default;font-weight:500}
.cellbtn.sel{box-shadow:0 0 0 2px var(--text) inset}
.mtable td.tot{font-weight:800;color:var(--muted)}

/* products & status */

.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:18px}

.mbox{background:var(--chip);border-radius:14px;padding:12px 14px}

e":"By availability","statusHint":"Sorted by each announcement’s main status. Many combine generally available parts with previews—check the details.","allTitle":"All announcements","allHint":"Full list ordered by main idea.","bonLink":"Official Book of News","sourcesN":"{n} linked sources","theme_auto":"Theme: auto","theme_dark":"Theme: dark","theme_light":"Theme: light","langLabel":"Language","updated":"Updated November 18, 2026","print":"Print","family":"Family","idea":"Idea","title":"Title","summary":"Summary","pillarsIntro":"Four pillars, fifteen ideas. Each card groups the announcements pushing in the same direction, whatever product they come from.","clickCell":"Select a matrix cell to see its announcements.","mainStatus":"Main status","connections":"connections","center":"announcements","sources":"Sources"}},"ideas":[{"id":"os","pillar":"ambition","h":212,"icon":"M3 4h18v13H3z M3 8h18 M8 21h8 M12 17v4","n":{"es":"Copilot, el sistema operativo del trabajo","ca":"Copilot, el sistema operatiu de la feina","en":"Copilot as the operating system for work"},"tg":{"es":"Preguntar, crear, delegar y construir desde un único lugar.","ca":"Preguntar, crear, delegar i construir des d’un sol lloc.","en":"Ask, create, delegate and build from one place."},"d":{"es":"Copilot deja de ser un asistente lateral y se convierte en el punto de partida del trabajo: Home une Chat y Cowork, Office vive dentro de Copilot y nuevas superficies como Today o Workspaces se anticipan a lo que necesitas; en Windows, Copilot ayuda con archivos y diagnósticos. Todo hereda permisos, etiquetas y cumplimiento de Microsoft 365.","ca":"Copilot deixa de ser un assistent lateral i es converteix en el punt de partida de la feina: Home uneix Chat i Cowork, Office viu dins de Copilot i noves superfícies com Today o Workspaces s’anticipen al que necessites; a Windows, Copilot ajuda amb fitxers i diagnòstics. Tot hereta permisos, etiquetes i compliment de Microsoft 365.","en":"Copilot moves from side-panel assistant to the starting point of work: Home brings Chat and Cowork together, Office lives inside Copilot, and new surfaces such as Today and Workspaces anticipate what you need; on Windows, Copilot helps with files and diagnostics. Everything inherits Microsoft 365 permissions, labels and compliance."},"sn":{"es":"Copilot como SO","ca":"Copilot com a SO","en":"Copilot as OS"}},{"id":"delegate","pillar":"ambition","h":268,"icon":"M3 12h12 M11 6l6 6-6 6 M21 4v16","n":{"es":"Del prompt a la delegación","ca":"Del prompt a la delegació","en":"From prompts to delegation"},"tg":{"es":"Agentes que trabajan sin esperar instrucciones, con las personas al mando.","ca":"Agents que treballen sense esperar instruccions, amb les persones al comandament.","en":"Agents that work without waiting to be asked, with people in charge."},"d":{"es":"La novedad no es responder mejor, sino actuar: Autopilot trabaja siempre activo con identidad propia, Cowork propone tareas y divide el trabajo en partes con el modelo adecuado, los agentes reaccionan a eventos e incluso disponen de su propio PC en la nube. Las personas deciden, aprueban y supervisan.","ca":"La novetat no és respondre millor, sinó actuar: Autopilot treballa sempre actiu amb identitat pròpia, Cowork proposa tasques i divideix la feina en parts amb el model adequat, els agents reaccionen a esdeveniments i fins i tot tenen el seu propi PC al núvol. Les persones decideixen, aproven i supervisen.","en":"The shift is from answering to acting: Autopilot is always on with its own identity, Cowork proposes tasks and splits work into parts with the right model for each, agents react to events and even get their own Cloud PC. People decide, approve and oversee."},"sn":{"es":"Delegar en agentes","ca":"Delegar en agents","en":"Delegation"}},{"id":"process","pillar":"ambition","h":26,"icon":"M4 4h7v6H4z M13 14h7v6h-7z M7.5 10v4.5a2 2 0 0 0 2 2H13 M16.5 14V9.5a2 2 0 0 0-2-2H11","n":{"es":"Los procesos de negocio entran en Copilot","ca":"Els processos de negoci entren a Copilot","en":"Business processes move into Copilot"},"tg":{"es":"Plugins y skills llevan ventas, finanzas y operaciones al flujo de trabajo.","ca":"Plugins i skills porten vendes, finances i operacions al flux de feina.","en":"Plugins and skills bring sales, finance and operations into the flow of work."},"d":{"es":"Copilot se convierte en la puerta de entrada a los sistemas de registro: Dynamics 365 y Salesforce llegan como plugins con skills de ventas, finanzas y operaciones, respetando los permisos de cada sistema, y Dynamics 365 Activate usa agentes para migrar el CRM y el ERP.","ca":"Copilot esdevé la porta d’entrada als sistemes de registre: Dynamics 365 i Salesforce hi arriben com a plugins amb skills de vendes, finances i operacions, respectant els permisos de cada sistema, i Dynamics 365 Activate fa servir agents per migrar el CRM i l’ERP.","en":"Copilot becomes the front door to systems of record: Dynamics 365 and Salesforce arrive as plugins with sales, finance and operations skills, honoring each system’s permissions, and Dynamics 365 Activate uses agents to migrate CRM and ERP."},"sn":{"es":"Procesos en Copilot","ca":"Processos a Copilot","en":"Processes in Copilot"}},{"id":"build","pillar":"ambition","h":152,"icon":"M8 7l-5 5 5 5 M16 7l5 5-5 5 M13.5 4l-3 16","n":{"es":"Todos construyen, TI gobierna","ca":"Tothom construeix, TI governa","en":"Everyone builds, IT governs"},"tg":{"es":"Las apps son el nuevo entregable: se crean conversando y se ejecutan gestionadas.","ca":"Les apps són el nou lliurable: es creen conversant i s’executen gestionades.","en":"Apps are the new deliverable: created in conversation, run as managed assets."},"d":{"es":"Cualquier persona puede describir una app, un panel o un agente y publicarlo; Copilot Managed Runtime, Fabric apps y Copilot Studio aportan hosting, identidad, datos gobernados y ciclo de vida, con un inventario centralizado para TI. Los desarrolladores mantienen Git, CLI y sus propias herramientas.","ca":"Qualsevol persona pot descriure una app, un tauler o un agent i publicar-lo; Copilot Managed Runtime, Fabric apps i Copilot Studio aporten allotjament, identitat, dades governades i cicle de vida, amb un inventari centralitzat per a TI. Els desenvolupadors mantenen Git, CLI i les seves pròpies eines.","en":"Anyone can describe an app, dashboard or agent and publish it; Copilot Managed Runtime, Fabric apps and Copilot Studio provide hosting, identity, governed data and lifecycle, with a central inventory for IT. Developers keep Git, CLIs and their own tools."},"sn":{"es":"Todos construyen","ca":"Tothom construeix","en":"Everyone builds"}},{"id":"context","pillar":"intelligence","h":190,"icon":"M12 2.5a3 3 0 0 1 3 3 3 3 0 0 1 3 5.2A3 3 0 0 1 16 16a3 3 0 0 1-4 3.5A3 3 0 0 1 8 16a3 3 0 0 1-2-5.3A3 3 0 0 1 9 5.5a3 3 0 0 1 3-3z M12 5.5v14 M9 10h6 M8.5 14h7","n":{"es":"Tu IQ es tu ventaja","ca":"La teva IQ és el teu avantatge","en":"Your IQ is your edge"},"tg":{"es":"Si todos tienen los mismos modelos, lo que te diferencia es tu contexto.","ca":"Si tothom té els mateixos models, el que et diferencia és el teu context.","en":"When everyone has the same models, your context is what sets you apart."},"d":{"es":"Microsoft IQ reúne Work IQ, Fabric IQ, Foundry IQ y Web IQ para capturar, gobernar y reutilizar el conocimiento de la organización. Los business plugins empaquetan ese saber una vez y lo heredan todos los agentes —también en ChatGPT o Claude— sin ceder la propiedad intelectual.","ca":"Microsoft IQ aplega Work IQ, Fabric IQ, Foundry IQ i Web IQ per capturar, governar i reutilitzar el coneixement de l’organització. Els business plugins empaqueten aquest saber una sola vegada i l’hereten tots els agents —també a ChatGPT o Claude— sense cedir la propietat intel·lectual.","en":"Microsoft IQ brings Work IQ, Fabric IQ, Foundry IQ and Web IQ together to capture, govern and reuse organizational knowledge. Business plugins package that know-how once and every agent inherits it—including in ChatGPT or Claude—without giving away your IP."},"sn":{"es":"Tu IQ","ca":"La teva IQ","en":"Your IQ"}},{"id":"learn","pillar":"intelligence","h":128,"icon":"M20 12a8 8 0 1 1-2.4-5.7 M20 4v4h-4 M9 12l2 2 4-4","n":{"es":"Agentes que aprenden y mejoran","ca":"Agents que aprenen i milloren","en":"Agents that keep getting better"},"tg":{"es":"Mejora continua basada en señales reales de producción.","ca":"Millora contínua basada en senyals reals de producció.","en":"Continuous improvement driven by real production signals."},"d":{"es":"Foundry cierra el ciclo: define qué es «bueno» con evaluaciones, detecta fallos recurrentes en las trazas, propone y prueba mejoras de instrucciones, skills, modelo o coste, e incluso reentrena modelos con tus datos. Nada llega a producción sin la aprobación del equipo.","ca":"Foundry tanca el cicle: defineix què és «bo» amb avaluacions, detecta errors recurrents a les traces, proposa i prova millores d’instruccions, skills, model o cost, i fins i tot reentrena models amb les teves dades. Res no arriba a producció sense l’aprovació de l’equip.","en":"Foundry closes the loop: define “good” with evaluations, surface recurring failures in traces, propose and test improvements to instructions, skills, model or cost, and even post-train models on your data. Nothing reaches production without the team’s approval."},"sn":{"es":"Mejora continua","ca":"Millora contínua","en":"Continuous improvement"}},{"id":"economics","pillar":"intelligence","h":44,"icon":"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M15 9.3c-.4-1.1-1.6-1.8-3-1.8-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.5 0-2.7-.7-3.1-1.9 M12 5.8v1.7 M12 16.5v1.7","n":{"es":"Economía de la IA: más valor por token","ca":"Economia de la IA: més valor per token","en":"AI economics: more value per token"},"tg":{"es":"El modelo justo para cada tarea y visibilidad total de gasto y retorno.","ca":"El model just per a cada tasca i visibilitat total de despesa i retorn.","en":"The right model for every task, and full visibility of spend and return."},"d":{"es":"Enrutado automático entre modelos, modelos de decisión rápidos y baratos, una nueva familia MAI con gran relación calidad-precio y herramientas FinOps para la IA: Agent 365 mide el trabajo completado —no solo tokens—, fija límites de gasto y permite elegir qué modelos se usan.","ca":"Encaminament automàtic entre models, models de decisió ràpids i econòmics, una nova família MAI amb una gran relació qualitat-preu i eines FinOps per a la IA: Agent 365 mesura la feina completada —no només tokens—, fixa límits de despesa i permet triar quins models s’utilitzen.","en":"Automatic routing across models, fast low-cost decision models, a new MAI family with strong price-performance and FinOps tooling for AI: Agent 365 measures work completed—not just tokens—sets spending limits and controls which models are available."},"sn":{"es":"Economía de la IA","ca":"Economia de la IA","en":"AI economics"}},{"id":"open","pillar":"intelligence","h":306,"icon":"M9.5 14.5a3.5 3.5 0 0 0 5 0l3.5-3.5a3.5 3.5 0 0 0-5-5l-1 1 M14.5 9.5a3.5 3.5 0 0 0-5 0L6 13a3.5 3.5 0 0 0 5 5l1-1","n":{"es":"Ecosistema abierto: cualquier modelo, cualquier agente","ca":"Ecosistema obert: qualsevol model, qualsevol agent","en":"Open ecosystem: any model, any agent"},"tg":{"es":"MCP, plugins y gobierno que también funcionan fuera de Microsoft.","ca":"MCP, plugins i govern que també funcionen fora de Microsoft.","en":"MCP, plugins and governance that also work beyond Microsoft."},"d":{"es":"Ignite 2026 apuesta por la interoperabilidad: más de 11.000 modelos en Foundry, contexto para cualquier agente vía MCP, Work IQ y Fabric IQ en ChatGPT y Claude, Salesforce dentro de Copilot y Defender protegiendo agentes como Claude Code o ChatGPT. El gobierno viaja con el contexto.","ca":"Ignite 2026 aposta per la interoperabilitat: més d’11.000 models a Foundry, context per a qualsevol agent via MCP, Work IQ i Fabric IQ a ChatGPT i Claude, Salesforce dins de Copilot i Defender protegint agents com Claude Code o ChatGPT. El govern viatja amb el context.","en":"Ignite 2026 leans into interoperability: 11,000+ models in Foundry, context for any agent via MCP, Work IQ and Fabric IQ in ChatGPT and Claude, Salesforce inside Copilot and Defender protecting agents such as Claude Code or ChatGPT. Governance travels with the context."},"sn":{"es":"Ecosistema abierto","ca":"Ecosistema obert","en":"Open ecosystem"}},{"id":"trust","pillar":"trust","h":246,"icon":"M12 3l7 3v6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z M9 12l2 2 4-4","n":{"es":"Cada agente con identidad, responsable y límites","ca":"Cada agent amb identitat, responsable i límits","en":"Every agent gets an identity, an owner and limits"},"tg":{"es":"Gobernar agentes como a las personas: identidad, acceso, contención y auditoría.","ca":"Governar agents com les persones: identitat, accés, contenció i auditoria.","en":"Govern agents like people: identity, access, containment and audit."},"d":{"es":"Entra Agent ID da identidad a cada agente; Agent 365 se convierte en el plano de control y observabilidad, con un riesgo dinámico por agente; Windows, Intune, Edge, Agent Grid y los sandboxes de AKS limitan qué puede tocar un agente; y Defender y Purview vigilan lo que hacen los agentes locales y los datos que usan.","ca":"Entra Agent ID dona identitat a cada agent; Agent 365 esdevé el pla de control i observabilitat, amb un risc dinàmic per agent; Windows, Intune, Edge, Agent Grid i els sandboxes d’AKS limiten què pot tocar un agent; i Defender i Purview vigilen el que fan els agents locals i les dades que fan servir.","en":"Entra Agent ID gives each agent an identity; Agent 365 becomes the control and observability plane, with dynamic risk per agent; Windows, Intune, Edge, Agent Grid and AKS sandboxes limit what an agent can touch; and Defender and Purview watch what local agents do and the data they use."},"sn":{"es":"Identidad y límites","ca":"Identitat i límits","en":"Identity & limits"}},{"id":"defense","pillar":"trust","h":2,"icon":"M13 2L4 14h7l-1 8 9-12h-7z","n":{"es":"Defensa a velocidad de máquina","ca":"Defensa a velocitat de màquina","en":"Defense at machine speed"},"tg":{"es":"Si los atacantes usan IA, la defensa también: agentes que detectan, investigan y corrigen.","ca":"Si els atacants fan servir IA, la defensa també: agents que detecten, investiguen i corregeixen.","en":"If attackers use AI, so must defenders: agents that detect, investigate and remediate."},"d":{"es":"Microsoft Perception llega a disponibilidad general con equipos de agentes rojos, azules y verdes orquestados por playbooks; Defender une SIEM y XDR, protege sistemas vulnerables antes del parche y destaca zero-days y amenazas emergentes; y Codename MDASH encuentra y valida vulnerabilidades en el código. Las personas fijan prioridades y aprueban las acciones críticas.","ca":"Microsoft Perception arriba a disponibilitat general amb equips d’agents vermells, blaus i verds orquestrats per playbooks; Defender uneix SIEM i XDR, protegeix sistemes vulnerables abans del pedaç i destaca zero-days i amenaces emergents; i Codename MDASH troba i valida vulnerabilitats al codi. Les persones fixen prioritats i aproven les accions crítiques.","en":"Microsoft Perception reaches general availability with red, blue and green agent teams orchestrated by playbooks; Defender unifies SIEM and XDR, shields vulnerable systems before the patch and spotlights zero-days and emerging threats; and Codename MDASH finds and validates vulnerabilities in code. People set priorities and approve critical actions."},"sn":{"es":"Defensa agéntica","ca":"Defensa agèntica","en":"Agentic defense"}},{"id":"foundation","pillar":"trust","h":224,"icon":"M6 11h12v10H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3 M12 15v2","n":{"es":"Seguro por defecto","ca":"Segur per defecte","en":"Secure by default"},"tg":{"es":"Cimientos resilientes: configuración segura de serie, menos privilegios y parches más rápidos.","ca":"Fonaments resilients: configuració segura de sèrie, menys privilegis i pedaços més ràpids.","en":"Resilient foundations: secure configuration by default, less privilege, faster patching."},"d":{"es":"Windows da a los proveedores de seguridad una plataforma más segura y aplica una protección base desde el arranque; Autopatch e Intune mantienen al día equipos, servidores y apps; Purview y Entra refuerzan clasificación, recuperación e identidad; Windows Server 2028 llega endurecido de serie; y los servidores locales tendrán un modo de seguridad base.","ca":"Windows dona als proveïdors de seguretat una plataforma més segura i aplica una protecció base des de l’arrencada; Autopatch i Intune mantenen al dia equips, servidors i apps; Purview i Entra reforcen classificació, recuperació i identitat; Windows Server 2028 arriba enfortit de sèrie; i els servidors locals tindran un mode de seguretat base.","en":"Windows gives security vendors a safer platform and applies baseline protection from boot; Autopatch and Intune keep devices, servers and apps current; Purview and Entra strengthen classification, recovery and identity; Windows Server 2028 ships hardened by default; and on-premises servers get a baseline security mode."},"sn":{"es":"Seguro por defecto","ca":"Segur per defecte","en":"Secure by default"}},{"id":"sovereign","pillar":"trust","h":330,"icon":"M5 21V4 M5 4h12l-2.5 4.5L17 13H5","n":{"es":"Soberanía: tu IA, bajo tu control","ca":"Sobirania: la teva IA, sota el teu control","en":"Sovereignty: your AI, under your control"},"tg":{"es":"Elegir dónde corre la IA, quién accede y con qué garantías.","ca":"Triar on s’executa la IA, qui hi accedeix i amb quines garanties.","en":"Choose where AI runs, who can access it and with what guarantees."},"d":{"es":"La computación confidencial protege los datos también mientras se procesan —en varias GPU, en enclaves y en clean rooms—; DocumentDB podrá ejecutarse con Azure Arc o en Azure Local por soberanía y residencia; Foundry desplegará modelos en tus propios clústeres eligiendo región por residencia de datos; y Windows Server 2028 lleva la inferencia a infraestructura propia. Para el sector público y regulado: más opciones sin renunciar a la innovación.","ca":"La computació confidencial protegeix les dades també mentre es processen —en diverses GPU, en enclavaments i en clean rooms—; DocumentDB es podrà executar amb Azure Arc o a Azure Local per sobirania i residència; Foundry desplegarà models als teus propis clústers triant la regió per residència de dades; i Windows Server 2028 porta la inferència a infraestructura pròpia. Per al sector públic i regulat: més opcions sense renunciar a la innovació.","en":"Confidential computing protects data even while it is processed—across GPUs, in enclaves and in clean rooms; DocumentDB will run with Azure Arc or on Azure Local for sovereignty and residency; Foundry will deploy models to your own clusters with regions chosen for data residency; and Windows Server 2028 brings inference onto your own infrastructure. For public sector and regulated industries: more choice without giving up innovation."},"sn":{"es":"Soberanía","ca":"Sobirania","en":"Sovereignty"}},{"id":"hybrid","pillar":"infra","h":58,"icon":"M2 18h12 M4 18V9h8v9 M15.5 12.5a3.2 3.2 0 0 1 6 1.4A2.3 2.3 0 0 1 20.3 18H16","n":{"es":"Inteligencia híbrida: del PC al centro de datos","ca":"Intel·ligència híbrida: del PC al centre de dades","en":"Hybrid intelligence: from PC to datacenter"},"tg":{"es":"Cada tarea se ejecuta donde tiene más sentido: en el dispositivo, en tu servidor o en la nube.","ca":"Cada tasca s’executa on té més sentit: al dispositiu, al teu servidor o al núvol.","en":"Each task runs where it makes most sense: on the device, on your server or in the cloud."},"d":{"es":"Copilot en Windows aprovecha el contexto del propio equipo; los Cloud PCs de Windows 365, con hasta 32 vCPU y GPU, ejecutan modelos locales con Foundry Local; y Windows Server 2028 lleva la inferencia junto a los datos y las aplicaciones críticas, conectada a Azure.","ca":"Copilot a Windows aprofita el context del mateix equip; els Cloud PCs de Windows 365, amb fins a 32 vCPU i GPU, executen models locals amb Foundry Local; i Windows Server 2028 porta la inferència al costat de les dades i les aplicacions crítiques, connectada a Azure.","en":"Copilot on Windows draws on on-device context; Windows 365 Cloud PCs with up to 32 vCPUs and GPUs run local models with Foundry Local; and Windows Server 2028 brings inference next to critical data and applications, connected to Azure."},"sn":{"es":"Inteligencia híbrida","ca":"Intel·ligència híbrida","en":"Hybrid intelligence"}},{"id":"modernize","pillar":"infra","h":96,"icon":"M5 19c1-3 2.5-4.5 4-5 M14.5 4.5c3 0 5 2 5 5l-6.5 6.5-5-5z M15 9h.01 M4 14l2-2 M10 20l2-2","n":{"es":"Modernizar y operar con agentes","ca":"Modernitzar i operar amb agents","en":"Modernize and operate with agents"},"tg":{"es":"De la deuda técnica a la nube agéntica: planificar, migrar y operar con agentes.","ca":"Del deute tècnic al núvol agèntic: planificar, migrar i operar amb agents.","en":"From technical debt to an agentic cloud: plan, migrate and run with agents."},"d":{"es":"Azure Catalyst unifica descubrimiento, plan, migración y modernización con Azure Copilot y GitHub Copilot; Azure Monitor, Azure Copilot y SRE Agent pasan de sugerir a actuar con las personas al mando; los agentes de bases de datos detectan y corrigen problemas; y nuevas rutas migran Oracle a PostgreSQL y SAP ECC a Dynamics 365.","ca":"Azure Catalyst unifica descobriment, pla, migració i modernització amb Azure Copilot i GitHub Copilot; Azure Monitor, Azure Copilot i SRE Agent passen de suggerir a actuar amb les persones al comandament; els agents de bases de dades detecten i corregeixen problemes; i noves rutes migren Oracle a PostgreSQL i SAP ECC a Dynamics 365.","en":"Azure Catalyst unifies discovery, planning, migration and modernization with Azure Copilot and GitHub Copilot; Azure Monitor, Azure Copilot and SRE Agent move from suggesting to acting with people in control; database agents detect and fix issues; and new paths migrate Oracle to PostgreSQL and SAP ECC to Dynamics 365."},"sn":{"es":"Modernizar y operar","ca":"Modernitzar i operar","en":"Modernize & operate"}},{"id":"platform","pillar":"infra","h":172,"icon":"M4 4h16v6H4z M4 14h16v6H4z M8 7h.01 M8 17h.01 M12 7h4 M12 17h4","n":{"es":"Datos e infraestructura para la escala agéntica","ca":"Dades i infraestructura per a l’escala agèntica","en":"Data and infrastructure for agentic scale"},"tg":{"es":"Silicio propio, PostgreSQL para IA y Kubernetes preparado para agentes.","ca":"Silici propi, PostgreSQL per a IA i Kubernetes preparat per a agents.","en":"Custom silicon, PostgreSQL for AI and Kubernetes ready for agents."},"d":{"es":"Cobalt 200 refuerza el silicio propio de Microsoft; HorizonDB lleva PostgreSQL a escala crítica y a Fabric; Cosmos DB, Redis 8 y Azure SQL se preparan para apps y agentes; AKS recibe modelos y agentes desde Foundry con sandboxes aislados; y Fabric se conecta con Salesforce Data 360 sin duplicar datos.","ca":"Cobalt 200 reforça el silici propi de Microsoft; HorizonDB porta PostgreSQL a escala crítica i a Fabric; Cosmos DB, Redis 8 i Azure SQL es preparen per a apps i agents; AKS rep models i agents des de Foundry amb sandboxes aïllats; i Fabric es connecta amb Salesforce Data 360 sense duplicar dades.","en":"Cobalt 200 strengthens Microsoft’s own silicon; HorizonDB takes PostgreSQL to mission-critical scale and into Fabric; Cosmos DB, Redis 8 and Azure SQL get ready for apps and agents; AKS receives models and agents from Foundry with isolated sandboxes; and Fabric connects with Salesforce Data 360 without duplicating data."},"sn":{"es":"Datos e infraestructura","ca":"Dades i infraestructura","en":"Data & infrastructure"}}],"pillars":[{"id":"ambition","n":{"es":"Ambición humana","ca":"Ambició humana","en":"Human ambition"},"d":{"es":" tps://news.microsoft.com/events/ignite/2026/book-of-news/#azure-expands-confidential-computing-for-protecting-highly-sensitive-data","sl":"Microsoft Ignite 2026 | Book of News","x":false,"t":{"es":"La computación confidencial se amplía a multi-GPU, enclaves y clean rooms","ca":"La computació confidencial s’amplia a multi-GPU, enclavaments i clean rooms","en":"Confidential computing expands to multi-GPU, enclaves and clean rooms"},"d":{"es":"Tres previews extienden la protección a los datos mientras se procesan: en varias GPU para modelos grandes, en entornos de confianza más acotados y en analítica entre varias partes sin que ninguna vea los datos en bruto de las demás.","ca":"Tres previews estenen la protecció a les dades mentre es processen: en diverses GPU per a models grans, en entorns de confiança més acotats i en analítica entre diverses parts sense que cap vegi les dades en brut de les altres.","en":"Three previews extend protection to data while it is being processed: across several GPUs for large models, inside smaller trusted environments, and in multiparty analytics where no participant sees the others’ raw data."},"b":[["preview",{"es":"Computación confidencial multi-GPU VR72 para modelos que no caben en una GPU","ca":"Computació confidencial multi-GPU VR72 per a models que no caben en una GPU","en":"VR72 multi-GPU confidential computing for models larger than one GPU"}],["preview",{"es":"Azure Confidential Enclaves y contenedores confidenciales Kata CoCo en AKS","ca":"Azure Confidential Enclaves i contenidors confidencials Kata CoCo a AKS","en":"Azure Confidential Enclaves and AKS Kata CoCo confidential containers"}],["preview",{"es":"Azure Confidential Clean Room para analítica entre varias organizaciones","ca":"Azure Confidential Clean Room per a analítica entre diverses organitzacions","en":"Azure Confidential Clean Room for multiparty analytics"}]]},{"id":"cobalt-200","p":"platform","s":["economics"],"st":["ga"],"f":"azure","a":["it","dev"],"pr":["A e Workload Center per a Oracle i SAP (preview privada)","en":"Azure Workload Center for Oracle and SAP (private preview)"}],["preview",{"es":"Azure SRE Agent: claves del cliente, Entra Agent ID, colaboración entre agentes, Teams y multicloud","ca":"Azure SRE Agent: claus del client, Entra Agent ID, col·laboració entre agents, Teams i multinúvol","en":"Azure SRE Agent: customer-managed keys, Entra Agent ID, cross-agent work, Teams and multicloud"}]]},{"id":"ai-infrastructure","p":"platform","s":["sovereign","trust","open"],"st":["preview","ga"],"f":"azure","a":["it","dev"],"pr":["Microsoft Foundry","Azure Kubernetes Service","Agent Grid","Agent Sandbox"],"u":"https://news.microsoft.com/events/ignite/2026/book-of-news/#azure-infrastructure-foundation-for-production-ai-applications-and-agents","sl":"Microsoft Ignite 2026 | Book of News","x":false,"t":{"es":"Una base en Azure para apps y agentes de IA en producción","ca":"Una base a Azure per a apps i agents d’IA en producció","en":"An Azure foundation for AI apps and agents in production"},"d":{"es":"Foundry podrá desplegar modelos open-weight y agentes en tus propios clústeres AKS con las políticas que ya tienes, eligiendo GPU y región por coste, latencia y residencia de datos, mientras nuevas piezas protegen el tráfico de los agentes y aíslan el código que generan.","ca":"Foundry podrà desplegar models open-weight i agents als teus propis clústers AKS amb les polítiques que ja tens, triant GPU i regió per cost, latència i residència de dades, mentre noves peces protegeixen el trànsit dels agents i aïllen el codi que generen.","en":"Foundry will deploy open-weight models and agents to your own AKS clusters with the policies you already have, choosing GPUs and regions by cost, latency and data residency, while new building blocks secure agent traffic and isolate agent-written code."},"b":[["preview",{"es":"Despliegue de modelos open-weight y agentes de Foundry en tu propio AKS","ca":"Desplegament de models open-weight <script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('app-data').textContent);
var UI = DATA.ui, IDEAS = DATA.ideas, PILLARS = DATA.pillars, FAMS = DATA.families, ITEMS = DATA.items, SOURCES = DATA.sources;

IDEAS.forEach(function(i, k){ i.order = k; IDEA[i.id] = i; });
FAMS.forEach(function(f){ FAM[f.id] = f; });

var STATUSES = ['ga','rolling','preview','soon','announced'];

  get: function(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } },
  set: function(k, v){ try { window.localStorage.setItem(k, v); } catch(e){} }
};
var S = { lang:'es', theme:'auto', view:'ideas', idea:null, q:'', st:new Set(), au:new Set(), conn:true, cell:null, modal:null };

/* ---------- helpers ---------- */
function t(k, vars){
  var s = (UI[S.lang] && UI[S.lang][k]) || UI.en[k] || k;
  if (vars) Object.keys(vars).forEach(function(a){ s = s.split('{' + a + '}').join(vars[a]); });
  return s;
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(s){ return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function fmt(n){ try { return new Intl.NumberFormat(S.lang === 'en' ? 'en-US' : (S.lang === 'ca' ? 'ca-ES' : 'es-ES')).format(n); } catch(e){ return String(n); } }
function $(sel, root){ return (root || document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function icon(path, extra){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra || '') + '><path d="' + path + '"/></svg>'; }
var IC = {
  ideas:'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z',
  constellation:'M5 6a2 2 0 1 0 0 .01 M19 5a2 2 0 1 0 0 .01 M12 13a2 2 0 1 0 0 .01 M6 19a2 2 0 1 0 0 .01 M18 18a2 2 0 1 0 0 .01 M6.5 7.5l4 4 M17.5 6.5l-4 5 M7.5 17.5l3-3 M16.5 16.5l-3-2',
  matrix:'M3 4h18v16H3z M3 10h18 M3 15h18 M9 4v16 M15 4v16',
  products:'M3 7l9-4 9 4-9 4z M3 12l9 4 9-4 M3 17l9 4 9-4',
  status:'M4 5h4v14H4z M10 5h4v9h-4z M16 5h4v5h-4z',

  search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4',
  sun:'M12 4V2 M12 22v-2 M4 12H2 M22 12h-2 M5.6 5.6 4.2 4.2 M19.8 19.8l-1.4-1.4 M5.6 18.4l-1.4 1.4 M19.8 4.2l-1.4 1.4 M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',
  moon:'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z',

  link:'M9.5 14.5a3.5 3.5 0 0 0 5 0l3.5-3.5a3.5 3.5 0 0 0-5-5l-1 1 M14.5 9.5a3.5 3.5 0 0 0-5 0L6 13a3.5 3.5 0 0 0 5 5l1-1',
  download:'M12 4v11 M7 10l5 5 5-5 M5 20h14',

};

/* ---------- state <-> hash ---------- */
function readHash(){
  if (location.hash && location.hash.indexOf('=') < 0) return;
  var p = new URLSearchParams(location.hash.replace(/^#/, ''));
  var l = p.get('l'); if (l && LANGS.indexOf(l) >= 0) S.lang = l;
  var v = p.get('v'); S.view = VIEWS.indexOf(v) >= 0 ? v : 'ideas';
  var i = p.get('i'); S.idea = (i && IDEA[i]) ? i : null;
  S.q = p.get('q') || '';
  S.st = new Set((p.get('st') || '').split(',').filter(function(x){ return STATUSES.indexOf(x) >= 0; }));
  S.au = new Set((p.get('au') || '').split(',').filter(function(x){ return AUDS.indexOf(x) >= 0; }));
  S.conn = p.get('c') !== '0';
  var c = (p.get('cell') || '').split('~'); S.cell = (c.length === 2 && IDEA[c[0]] && FAM[c[1]]) ? c : null;
  var a = p.get('a'); S.modal = (a && ITEM[a]) ? a : null;
}
function hashFor(over){
  var st = Object.assign({}, S, over || {});
  var p = new URLSearchParams();
  if (st.view !== 'ideas') p.set('v', st.view);
  if (st.idea && st.view === 'ideas') p.set('i', st.idea);
  if (st.q) p.set('q', st.q);
  if (st.st.size) p.set('st', Array.from(st.st).join(','));
  if (st.au.size) p.set('au', Array.from(st.au).join(','));
  if (!st.conn) p.set('c', '0');
  if (st.cell && st.view === 'matrix') p.set('cell', st.cell.join('~'));
  if (st.modal) p.set('a', st.modal);
  p.set('l', st.lang);
  return '#' + p.toString();
}
function writeHash(push){
  var h = hashFor();
  if (h === location.hash) return;
  try { history[push ? 'pushState' : 'replaceState'](null, '', h); } catch(e){ /* file:// or sandbox */ }
}

/* ---------- filtering ---------- */
function hay(a){
  a._h = a._h || {};
  if (!a._h[S.lang]){
    var L = S.lang;
    a._h[L] = norm([a.t[L], a.d[L], a.pr.join(' '), FAM[a.f].n[L], (a.b || []).map(function(x){ return x[1][L]; }).join(' ')].concat(a.all.map(function(x){ return IDEA[x].n[L] + ' ' + IDEA[x].sn[L]; })).join(' '));
  }
  return a._h[S.lang];
}
function terms(){ return norm(S.q).trim().split(/\s+/).filter(function(x){ return x.length > 0; }); }
function matches(a){
  var tt = terms();
  if (tt.length){ var h = hay(a); for (var i = 0; i < tt.length; i++){ if (h.indexOf(tt[i]) < 0) return false; } }
  if (S.st.size && !a.st.some(function(x){ return S.st.has(x); })) return false;
  if (S.au.size && !a.a.some(function(x){ return S.au.has(x); })) return false;
  return true;
}
function filtered(){ return ITEMS.filter(matches); }
function inIdea(a, id){ return a.p === id || (S.conn && a.s.indexOf(id) >= 0); }
function hl(text){
  var e = esc(text);
  var raw = S.q.trim().split(/\s+/).filter(function(x){ return x.length > 1; });
  if (!raw.length) return e;
  var re;
  try { re = new RegExp('(' + raw.map(function(x){ return reEsc(esc(x)); }).join('|') + ')', 'gi'); } catch(err){ return e; }
  return e.split(/(&[a-z#0-9]+;)/i).map(function(part){ return /^&[a-z#0-9]+;$/i.test(part) ? part : part.replace(re, '<mark>$1</mark>'); }).join('');
}
function byIdeaOrder(a, b){ return IDEA[a.p].order - IDEA[b.p].order || STATUSES.indexOf(a.st[0]) - STATUSES.indexOf(b.st[0]) || a.t[S.lang].localeCompare(b.t[S.lang]); }

/* ---------- small renderers ---------- */
function pills(a){
  var h = a.st.map(function(s){ return '<span class="pill st-' + s + '" title="' + esc(t('stl_' + s)) + '">' + esc(t('st_' + s)) + '</span>'; }).join('');
  if (a.x) h += '<span class="pill ext" title="' + esc(t('extSource')) + '">' + esc(t('extSource').split(' (')[0]) + '</span>';
  return h;
}
function idots(a){
  return a.all.map(function(x, k){ var I = IDEA[x]; return '<span class="idot' + (k === 0 ? ' main' : '') + '" style="--h:' + I.h + '" title="' + esc(I.n[S.lang]) + '"></span>'; }).join('');
}
function card(a, ctx){
  var L = S.lang, I = IDEA[a.p], conn = ctx && a.p !== ctx;
  var prods = a.pr.slice(0, 3).map(function(p){ return '<span class="pchip">' + hl(p) + '</span>'; }).join('') + (a.pr.length > 3 ? '<span class="pchip">+' + (a.pr.length - 3) + '</span>' : '');
  return '<article class="card c' + (conn ? ' is-conn' : '') + '" style="--h:' + I.h + '" data-open="' + a.id + '">' +
    '<div class="card-top">' + pills(a) + (conn ? '<span class="badge-conn">' + esc(t('connBadge')) + '</span>' : '') + '<span class="fam">' + esc(FAM[a.f].n[L]) + '</span></div>' +
    '<h3><button type="button" class="linklike" data-open="' + a.id + '">' + hl(a.t[L]) + '</button></h3>' +
    '<p>' + hl(a.d[L]) + '</p>' +
    '<div class="prods">' + prods + '</div>' +
    '<div class="card-foot"><div class="idots">' + idots(a) + '<span class="iname">' + esc(I.sn[L]) + '</span></div>' +
    '<a class="src" href="' + esc(a.u) + '" target="_blank" rel="noopener noreferrer" title="' + esc(a.sl) + '">' + esc(t('source')) + ' \u2197</a></div>' +
  '</article>';
}
function row(a){
  var I = IDEA[a.p];
  return '<button type="button" class="row c" style="--h:' + I.h + '" data-open="' + a.id + '"><span class="idot main" style="--h:' + I.h + '"></span><span class="rt">' + hl(a.t[S.lang]) + '</span>' + '<span class="pill st-' + a.st[0] + '">' + esc(t('st_' + a.st[0])) + '</span></button>';
}
function statusBar(list){
  var n = list.length || 1, c = {};
  list.forEach(function(a){ c[a.st[0]] = (c[a.st[0]] || 0) + 1; });
  return '<div class="sbar" role="img" aria-label="' + esc(STATUSES.filter(function(s){ return c[s]; }).map(function(s){ return t('st_' + s) + ': ' + c[s]; }).join(', ')) + '">' +
    STATUSES.map(function(s){ return c[s] ? '<i class="' + s + '" style="width:' + (100 * c[s] / n).toFixed(2) + '%"></i>' : ''; }).join('') + '</div>';
}
function topProducts(list, k){
  var m = {};
  list.forEach(function(a){ a.pr.forEach(function(p){ m[p] = (m[p] || 0) + 1; }); });
  return Object.keys(m).sort(function(x, y){ return m[y] - m[x] || x.localeCompare(y); }).slice(0, k).map(function(p){ return [p, m[p]]; });
}
function empty(){ return '<div class="empty-state">' + esc(t('noResults')) + '</div>'; }

/* ---------- views ---------- */
function vIdeas(list){
  var L = S.lang;
  var html = '<div class="vhead"><div><h2>' + esc(t('tab_ideas')) + '</h2><p>' + esc(t('pillarsIntro')) + '</p></div></div>';
  PILLARS.forEach(function(P, pi){
    html += '<section class="pillar"><div class="pillar-head"><span class="pn">' + esc(t('pillar')) + ' ' + (pi + 1) + '</span><h3>' + esc(P.n[L]) + '</h3><p>' + esc(P.d[L]) + '</p></div><div class="grid">';
    IDEAS.filter(function(I){ return I.pillar === P.id; }).forEach(function(I){
      var mem = list.filter(function(a){ return inIdea(a, I.id); });
      var prim = mem.filter(function(a){ return a.p === I.id; }).length;
      var tops = topProducts(mem, 3).map(function(x){ return '<span class="pchip">' + esc(x[0]) + '</span>'; }).join('');
      html += '<div class="icard c' + (mem.length ? '' : ' empty') + '" role="button" tabindex="0" aria-label="' + esc(I.n[L] + ' \u00b7 ' + mem.length + ' ' + t('ann')) + '" style="--h:' + I.h + '" data-idea="' + I.id + '">' +
        '<div class="ihead"><span class="ibubble">' + icon(I.icon) + '</span><span class="icount">' + mem.length + '<small>' + esc(mem.length === 1 ? t('ann1') : t('ann')) + '</small></span></div>' +
        '<h4>' + hl(I.n[L]) + '</h4><p class="tag">' + esc(I.tg[L]) + '</p>' + statusBar(mem) +
        '<div class="imeta"><span>' + esc(t('primaryN', {n: prim})) + '</span>' + (S.conn ? '<span>' + esc(t('connectedN', {n: mem.length - prim})) + '</span>' : '') + '</div>' +
        '<div class="pchips">' + tops + '</div></div>';
    });
    html += '</div></section>';
  });
  return html;
}
function vIdea(list, id){
  var L = S.lang, I = IDEA[id];
  var mem = list.filter(function(a){ return inIdea(a, id); }).sort(function(a, b){ return (a.p === id ? 0 : 1) - (b.p === id ? 0 : 1) || STATUSES.indexOf(a.st[0]) - STATUSES.indexOf(b.st[0]) || a.t[L].localeCompare(b.t[L]); });
  var prim = mem.filter(function(a){ return a.p === id; }).length;
  var cnt = {}; STATUSES.forEach(function(s){ cnt[s] = 0; }); mem.forEach(function(a){ cnt[a.st[0]]++; });
  var co = {};
  ITEMS.forEach(function(a){ if (a.all.indexOf(id) >= 0) a.all.forEach(function(x){ if (x !== id) co[x] = (co[x] || 0) + 1; }); });
  var coList = Object.keys(co).sort(function(x, y){ return co[y] - co[x]; }).slice(0, 8);
  var html = '<button type="button" class="crumb" data-back>' + icon(IC.back) + esc(t('back')) + '</button>' +
    '<section class="ideahero c" style="--h:' + I.h + '"><div class="top"><span class="bigicon">' + icon(I.icon) + '</span><div><span class="pn" style="font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">' + esc(t('pillar')) + ' \u00b7 ' + esc(PIL[I.pillar].n[L]) + '</span><h2>' + esc(I.n[L]) + '</h2><p class="tagl">' + esc(I.tg[L]) + '</p></div></div>' +
    '<p class="desc">' + esc(I.d[L]) + '</p>' +
    '<div class="stats"><div class="stat"><b>' + mem.length + '</b><span>' + esc(t('ann')) + '</span></div><div class="stat"><b>' + prim + '</b><span>' + esc(t('primaryLabel')) + '</span></div>' +
    '<div class="stat"><b style="color:var(--st-ga)">' + cnt.ga + '</b><span>' + esc(t('st_ga')) + '</span></div><div class="stat"><b style="color:var(--st-preview)">' + (cnt.preview + cnt.rolling) + '</b><span>' + esc(t('st_preview')) + ' / ' + esc(t('st_rolling')) + '</span></div><div class="stat"><b style="color:var(--st-soon)">' + (cnt.soon + cnt.announced) + '</b><span>' + esc(t('kpi_next')) + '</span></div></div></section>' +

function clusterR(n){ var r = 15 + 2.6 * Math.sqrt(n); return { r: r, cl: r + 11 + 5.8 * Math.sqrt(Math.max(n - 1, 0)) + 6 }; }

document.addEventListener('click', function(e){
  var el = e.target;
  if (el.closest('a[href^="http"]')) return;
  var x;
  if ((x = el.closest('[data-close]'))){ closeModal(); return; }
  if ((x = el.closest('[data-copy]'))){ copyText(location.href.split('#')[0] + hashFor()); return; }
  if ((x = el.closest('[data-view]'))){ go({view: x.getAttribute('data-view'), idea: null, cell: null, modal: null}, true); scrollToContent(); return; }
  if ((x = el.closest('[data-idea]'))){ go({view: 'ideas', idea: x.getAttribute('data-idea'), modal: null}, true); scrollToContent(); return; }
  if ((x = el.closest('[data-back]'))){ go({idea: null}, true); return; }
  if ((x = el.closest('[data-cell]'))){ var c = x.getAttribute('data-cell').split('~'); go({cell: (S.cell && S.cell[0] === c[0] && S.cell[1] === c[1]) ? null : c}, false); return; }
  if ((x = el.closest('[data-open]'))){ openModal(x.getAttribute('data-open')); return; }
  if ((x = el.closest('[data-lang]'))){ S.lang = x.getAttribute('data-lang'); store.set('ig26-lang', S.lang); writeHash(false); render(); return; }
  if ((x = el.closest('[data-st]'))){ var s = x.getAttribute('data-st'); if (S.st.has(s)) S.st.delete(s); else S.st.add(s); go({}, false); return; }
  if ((x = el.closest('[data-au]'))){ var u = x.getAttribute('data-au'); if (S.au.has(u)) S.au.delete(u); else S.au.add(u); go({}, false); return; }
  if (el.closest('#clear')){ go({q: '', st: new Set(), au: new Set(), conn: true}, false); return; }
  if (el.closest('#csv')){ csv(); return; }
  if (el.closest('#print')){ window.print(); return; }
  if (el.closest('#theme')){ S.theme = THEMES[(THEMES.indexOf(S.theme) + 1) % THEMES.length]; store.set('ig26-theme', S.theme); applyTheme(); renderChrome(); return; }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && S.modal){ closeModal(); return; }
  if (e.key === '/' && !/input|textarea/i.test((document.activeElement || {}).tagName || '')){ e.preventDefault(); $('#q').focus(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement){
    var a = document.activeElement;
    if (a.matches && a.matches('.node, .lrow, .icard')){ e.preventDefault(); a.dispatchEvent(new MouseEvent('click', {bubbles: true})); }
  }
  if (e.key === 'Tab' && S.modal){
    var f = $all('#modal button, #modal a[href]'); if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
var qt = null;
$('#q').addEventListener('input', function(e){ clearTimeout(qt); var v = e.target.value; qt = setTimeout(function(){ S.q = v; writeHash(false); renderView(); }, 140); });
$('#conn').addEventListener('change', function(e){ go({conn: e.target.checked}, false); });

/* tooltip + constellation hover */
document.addEventListener('pointermove', function(e){
  var c = e.target.closest && e.target.closest('.icard');
  if (!c) return;
  var r = c.getBoundingClientRect();
  c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
});
var tip = $('#tip');
document.addEventListener('mouseover', function(e){
  var d = e.target.closest && e.target.closest('[data-tip],[data-tipi]');
  if (!d){ return; }
  var L = S.lang, html = '';
  if (d.hasAttribute('data-tip')){ var a = ITEM[d.getAttribute('data-tip')]; html = '<b>' + esc(a.t[L]) + '</b><span>' + esc(t('st_' + a.st[0])) + ' \u00b7 ' + esc(FAM[a.f].n[L]) + '</span>'; }
  else { var I = IDEA[d.getAttribute('data-tipi')]; html = '<b>' + esc(I.n[L]) + '</b><span>' + esc(I.tg[L]) + '</span>'; }
  tip.innerHTML = html; tip.hidden = false;
  var svg = $('#const-svg');
  if (svg){
    var id = d.getAttribute('data-tipi') || d.getAttribute('data-p');
    if (id){ svg.classList.add('hovering'); $all('.edge.on, .dot.on, .node.on', svg).forEach(function(n){ n.classList.remove('on'); });
      $all('.edge[data-a="' + id + '"], .edge[data-b="' + id + '"], .dot[data-p="' + id + '"], .node[data-idea="' + id + '"]', svg).forEach(function(n){ n.classList.add('on'); }); }
  }
});
document.addEventListener('mousemove', function(e){
  if (tip.hidden) return;
  var x = e.clientX + 16, y = e.clientY + 16, w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > window.innerWidth - 8) x = e.clientX - w - 12;
  if (y + h > window.innerHeight - 8) y = e.clientY - h - 12;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
document.addEventListener('mouseout', function(e){
  var d = e.target.closest && e.target.closest('[data-tip],[data-tipi]');
  if (!d) return;
  var to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip],[data-tipi]');
  if (to) return;
  tip.hidden = true;
  var svg = $('#const-svg'); if (svg){ svg.classList.remove('hovering'); $all('.on', svg).forEach(function(n){ n.classList.remove('on'); }); }
});

window.addEventListener('popstate', function(){ readHash(); render(); });
window.addEventListener('hashchange', function(){ readHash(); render(); });

/* ---------- boot ---------- */
(function boot(){
  var sl = store.get('ig26-lang');
  if (sl && LANGS.indexOf(sl) >= 0) S.lang = sl;
  else {
    var nav = (navigator.languages || [navigator.language || 'es']).map(function(x){ return String(x).toLowerCase(); });
    for (var i = 0; i < nav.length; i++){ if (nav[i].indexOf('ca') === 0){ S.lang = 'ca'; break; } if (nav[i].indexOf('es') === 0){ S.lang = 'es'; break; } if (nav[i].indexOf('en') === 0){ S.lang = 'en'; break; } }
  }
  var th = store.get('ig26-theme'); if (th && THEMES.indexOf(th) >= 0) S.theme = th;
  applyTheme();
  readHash();
  render();
  animateKpis();
})();
})();

</script>
