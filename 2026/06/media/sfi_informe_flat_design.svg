<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="SFI · Informe de cronología">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a63d6"/>
      <stop offset="1" stop-color="#0a8aa0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- subtle grid / timeline dots -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="90" cy="70" r="4"/>
    <circle cx="150" cy="70" r="4"/>
    <circle cx="210" cy="70" r="4"/>
    <circle cx="510" cy="330" r="4"/>
    <circle cx="450" cy="330" r="4"/>
    <circle cx="390" cy="330" r="4"/>
  </g>

  <!-- timeline line -->
  <g stroke="#ffffff" opacity="0.35" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="330" x2="480" y2="330"/>
  </g>
  <g fill="#ffffff">
    <circle cx="120" cy="330" r="7" opacity="0.9"/>
    <circle cx="300" cy="330" r="7" opacity="0.9"/>
    <circle cx="480" cy="330" r="7" opacity="0.9"/>
  </g>

  <!-- shield -->
  <g transform="translate(300 175)">
    <path d="M0 -95 L78 -60 L78 10 C78 68 44 100 0 120 C-44 100 -78 68 -78 10 L-78 -60 Z"
          fill="url(#shield)" stroke="#ffffff" stroke-width="3"/>
    <!-- check mark -->
    <path d="M-34 6 L-8 34 L40 -30" fill="none" stroke="#1a63d6" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title text -->
  <text x="300" y="365" text-anchor="middle" font-family="Georgia, serif"
        font-size="26" font-weight="700" fill="#ffffff">SFI · Informe de cronología</text>
  <text x="300" y="52" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif"
        font-size="13" letter-spacing="4" fill="#ffffff" opacity="0.85">SECURE FUTURE INITIATIVE</text>
</svg>
