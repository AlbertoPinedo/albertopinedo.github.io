<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Seguridad al ritmo de la IA — Microsoft Security</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #0b1020;
    --panel: #131a33;
    --panel-2: #1a2347;
    --ink: #e7ecf7;
    --muted: #97a3c5;
    --accent: #6ee7f1;
    --accent-2: #f59e8b;
    --gold: #d4a64a;
    --crimson: #c0392b;
    --line: rgba(255,255,255,0.08);
  }
  html, body { background: var(--bg); color: var(--ink); transition: background 0.25s ease, color 0.25s ease; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .card-2 { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; }

  html[data-theme="light"] {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --panel-2: #eef2f9;
    --ink: #0f172a;
    --muted: #475569;
    --accent: #0891b2;
    --accent-2: #c2410c;
    --gold: #b8862b;
    --crimson: #b91c1c;
    --line: rgba(15,23,42,0.10);
  }
  html[data-theme="light"] .text-slate-100 { color: #0f172a !important; }
  html[data-theme="light"] .text-slate-200 { color: #1e293b !important; }
  html[data-theme="light"] .text-slate-300 { color: #334155 !important; }
  html[data-theme="light"] .text-slate-400 { color: #64748b !important; }
  html[data-theme="light"] .text-slate-500 { color: #94a3b8 !important; }
  html[data-theme="light"] .text-cyan-100 { color: #155e75 !important; }
  html[data-theme="light"] .text-cyan-200 { color: #0e7490 !important; }
  html[data-theme="light"] .text-cyan-300 { color: #0891b2 !important; }
  html[data-theme="light"] .text-amber-100 { color: #78350f !important; }
  html[data-theme="light"] .text-amber-200 { color: #92400e !important; }
  html[data-theme="light"] .text-amber-300 { color: #b45309 !important; }
  html[data-theme="light"] .text-emerald-100 { color: #064e3b !important; }
  html[data-theme="light"] .text-emerald-200 { color: #065f46 !important; }
  html[data-theme="light"] .text-emerald-300 { color: #047857 !important; }
  html[data-theme="light"] .text-orange-100 { color: #7c2d12 !important; }
  html[data-theme="light"] .text-orange-300 { color: #c2410c !important; }
  html[data-theme="light"] .text-red-200 { color: #991b1b !important; }
  html[data-theme="light"] .text-red-300 { color: #b91c1c !important; }
  html[data-theme="light"] .bg-slate-800\/40 { background-color: rgba(241,245,249,0.9) !important; }
  html[data-theme="light"] a { color: #0e7490; }
  html[data-theme="light"] a:hover { color: #155e75; }
  html[data-theme="light"] blockquote { color: #1e293b; }
  html[data-theme="light"] .tag { background: rgba(8,145,178,0.10); color: #0e7490; border-color: rgba(8,145,178,0.30); }
  html[data-theme="light"] .tag-warm { background: rgba(194,65,12,0.10); color: #c2410c; border-color: rgba(194,65,12,0.30); }
  html[data-theme="light"] .tag-gold { background: rgba(184,134,43,0.12); color: #92400e; border-color: rgba(184,134,43,0.35); }
  html[data-theme="light"] .tag-red { background: rgba(185,28,28,0.10); color: #991b1b; border-color: rgba(185,28,28,0.30); }
  html[data-theme="light"] .tag-blue { background: rgba(37,99,235,0.10); color: #1d4ed8; border-color: rgba(37,99,235,0.30); }
  html[data-theme="light"] .tag-green { background: rgba(5,150,105,0.10); color: #065f46; border-color: rgba(5,150,105,0.30); }
  html[data-theme="light"] .num-dot { background: linear-gradient(135deg, #0891b2, #1d4ed8); color: #fff; }
  html[data-theme="light"] .quote-mark::before { color: #0891b2; opacity: 0.5; }

  .theme-toggle {
    position: fixed; top: 18px; right: 18px; z-index: 50;
    width: 44px; height: 44px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--line);
    cursor: pointer; font-size: 1.2rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    transition: transform 0.2s ease, background 0.25s ease;
  }
  .theme-toggle:hover { transform: scale(1.08); }
  .tag { background: rgba(110,231,241,0.12); color: var(--accent); border: 1px solid rgba(110,231,241,0.25); }
  .tag-warm { background: rgba(245,158,139,0.12); color: var(--accent-2); border: 1px solid rgba(245,158,139,0.25); }
  .tag-gold { background: rgba(212,166,74,0.15); color: var(--gold); border: 1px solid rgba(212,166,74,0.35); }
  .tag-red { background: rgba(192,57,43,0.15); color: #ff8b7a; border: 1px solid rgba(192,57,43,0.35); }
  .tag-blue { background: rgba(91,141,239,0.15); color: #93b8ff; border: 1px solid rgba(91,141,239,0.35); }
  .tag-green { background: rgba(72,187,120,0.15); color: #7be9a0; border: 1px solid rgba(72,187,120,0.35); }
  .num-dot { background: linear-gradient(135deg, #6ee7f1, #5b8def); }
  a { color: #9cd6ff; }
  a:hover { color: #cfeaff; }
  .divider { border-top: 1px solid var(--line); }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .pillar-icon { font-size: 2.2rem; line-height: 1; }
  .quote-mark::before { content: "\201C"; font-family: Georgia, serif; font-size: 4rem; line-height: 0.5; color: var(--accent); opacity: 0.4; vertical-align: -0.3em; margin-right: 0.1em;}
  @media print {
    body { background: white; color: black; }
    .card, .card-2 { background: white; border: 1px solid #ddd; }
    .no-print { display: none !important; }
    a { color: black; text-decoration: underline; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">

function ThemeToggle() {
  const [theme, setTheme] = React.useState(() => {
    if (typeof window === 'undefined') return 'dark';
    return localStorage.getItem('mssec-theme') || 'dark';
  });
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('mssec-theme', theme);
  }, [theme]);
  return (
    <button className="theme-toggle no-print" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} title={theme === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'} aria-label="Cambiar tema">
      {theme === 'dark' ? '☀️' : '🌙'}
    </button>
  );
}

function Badge({children, warm, gold, red, blue, green}) {
  let cls = "tag";
  if (gold) cls = "tag-gold";
  else if (warm) cls = "tag-warm";
  else if (red) cls = "tag-red";
  else if (blue) cls = "tag-blue";
  else if (green) cls = "tag-green";
  return <span className={"inline-block text-xs font-medium px-2.5 py-1 rounded-full " + cls}>{children}</span>;
}

function SectionTitle({n, title, sub}) {
  return (
    <div className="flex items-start gap-4 mb-5">
      <div className="num-dot text-slate-900 font-bold w-9 h-9 rounded-full flex items-center justify-center shadow-md">{n}</div>
      <div>
        <h2 className="serif text-2xl tracking-tight">{title}</h2>
        {sub && <p className="text-sm text-slate-400 mt-0.5">{sub}</p>}
      </div>
    </div>
  );
}

function Collapsible({n, title, sub, defaultOpen = true, children}) {
  const [open, setOpen] = React.useState(defaultOpen);
  return (
    <section className="mb-8">
      <button
        type="button"
        onClick={() => setOpen(o => !o)}
        className="w-full text-left flex items-start gap-4 mb-3 group focus:outline-none"
        aria-expanded={open}
      >
        <div className="num-dot text-slate-900 font-bold w-9 h-9 rounded-full flex items-center justify-center shadow-md flex-shrink-0">{n}</div>
        <div className="flex-1">
          <h2 className="serif text-2xl tracking-tight flex items-center gap-2">
            {title}
            <span className={"text-cyan-300 text-base transition-transform duration-200 " + (open ? "rotate-90" : "")}>▶</span>
          </h2>
          {sub && <p className="text-sm text-slate-400 mt-0.5">{sub}</p>}
        </div>
      </button>
      {open && <div className="mt-4">{children}</div>}
    </section>
  );
}

function Term({t, d}) {
  return <span className="text-slate-100">{t} <span className="text-slate-400">({d})</span></span>;
}

const FIVE_CHANGES = [
  { t: "La velocidad como característica estructural", d: "Antes era la excepción del atacante; ahora es el modo por defecto. Un SOC (Security Operations Center — centro de operaciones de seguridad) que opera a ritmo humano ya está perdiendo la carrera contra adversarios automatizados que actúan en minutos, no en días." },
  { t: "Reconocimiento continuo y adaptativo", d: "Los agentes adversarios escanean su entorno 24/7 y se adaptan a lo que encuentran. Desaparece la noción de «periodo de silencio» que el SOC clásico aprovechaba para reorganizarse, actualizar firmas y desplegar parches." },
  { t: "Vulnerability chaining (encadenamiento de vulnerabilidades) como norma", d: "La unidad de riesgo deja de ser el CVE (Common Vulnerabilities and Exposures — identificador estándar de una vulnerabilidad concreta) individual: pasa a ser la secuencia de varios encadenados que, sumados, abren un camino completo desde el perímetro hasta la exfiltración." },
  { t: "Alcance al estate completo", d: "Cada identidad, endpoint (dispositivo), data store (repositorio de datos), workload (carga de trabajo cloud) y agente entra en perímetro. No hay activo «menor»: en la nueva cinética los agentes adversarios recorren la organización lateralmente con velocidad y persistencia." },
  { t: "Defensa autónoma como obligación", d: "No se puede contrarrestar velocidad de la IA con velocidad humana. La defensa misma tiene que ser agéntica: orquestada por modelos que despliegan agentes especializados, mantienen memoria y aprenden de cada incidente." },
];

const PILLAR_DEFEND = {
  text: "Construir un SOC autónomo apoyado en tres ingredientes inseparables — Señales, Inteligencia y Agentes — coordinados por un Frontier orchestrator (orquestador donde el modelo, no un script fijo, decide qué sub-orquestadores y agentes invocar). El paradigma cambia: los agentes de tareas que Microsoft ya enviaba como productos puntuales pasan a ser herramientas dentro de una arquitectura compuesta.",
  quote: "«Cualquiera puede construir un agente. Pero el grafo, la señal y las APIs son lo que permite escalar a nivel empresarial. Sin ellos, el agente es sólo un juguete; con ellos, es un sistema de defensa autónomo.»",
  details: [
    { h: "Señales — la base", b: "100 billones (10¹⁴) de señales/día procesadas en tiempo real. El valor no está en el volumen absoluto sino en que esa señal se ancla en los activos del cliente, construida de abajo arriba desde dispositivos, identidades, workloads, data stores y recursos de Azure Resource Graph (catálogo de recursos en Azure). Las señales sin contexto son ruido." },
    { h: "Inteligencia — el SecurityIQ Graph", b: "Microsoft transforma esas señales en un grafo (estructura ontológica que relaciona activos, identidades, eventos y riesgo) que los agentes pueden recorrer con bajo consumo de tokens. Con una reducción de x10 en uso de tokens frente a lanzar logs crudos al modelo. No es un CMDB (Configuration Management Database — base de datos de gestión de configuración) estático: es vivo, en tiempo real." },
    { h: "Agentes — el equipo especializado", b: "Equipos RED (Red Team — ataque ético), BLUE (operaciones de defensa: triage, hunting, detección, threat intelligence), GREEN (postura, prevención, remediación) y un Reviewer/Critic que mantiene al humano en el bucle (HITL — Human-In-The-Loop). Por encima, un Planner que actúa como coordinador del sistema, decidiendo qué agentes invocar para cada tarea." },

  formula: "Frontier coding models + data graph con contexto y memoria + security APIs = all jobs to be done",
};

const PILLAR_SAFELY = {
  text: "Salir de la falsa dicotomía NONO (postura de bloqueo total a la IA por parte de IT o CISO — Chief Information Security Officer) frente a YOLO (You Only Live Once — adopción sin controles, típicamente con herramientas consumer fuera de IT) hacia GOGO (habilitación con gobierno: ni bloqueo ni descontrol; IA productiva con guardrails).",

const PILLAR_TRUST = {
  text: "No hay confianza en IA sin asegurar primero el dato. Sin clasificación, sin labelling (etiquetado) y sin DLP (Data Loss Prevention — prevención de fuga de datos) inline, todo lo demás es ficción.",

  { phase: "VALIDAR", agents: 15, desc: "Debate adversario entre 4 modelos + análisis de alcance. Filtra falsos positivos antes del sandbox. Critic Personas (4), Analyzers (3), Triage (2), Frontier Models (4).", color: "warm" },

const GLOSARIO = [
  { t: "SOC", d: "Security Operations Center — centro de operaciones de seguridad." },
  { t: "BLUF", d: "Bottom Line Up Front — formato ejecutivo donde la conclusión va primero." },
  { t: "Kill chain", d: "Cadena de ataque: secuencia desde reconocimiento hasta impacto." },

function CaseCard({c}) {
  const tag = c.badge === "critical" ? <Badge red>Crítico</Badge> : <Badge warm>Severidad alta</Badge>;
  return (
    <div className="card p-5">
      <div className="flex items-start justify-between gap-3 mb-2 flex-wrap">
        <h3 className="font-semibold text-slate-100 serif text-xl">{c.name}</h3>
        {tag}
      </div>
      <p className="text-slate-300 leading-relaxed text-[15px]">{c.summary}</p>
      <div className="mt-3 divider pt-3 text-cyan-200 text-sm"><strong>Lección:</strong> {c.lesson}</div>
    </div>
  );
}

function TabDefensa() {
  return (
    <div>
      <div className="card-2 p-5 mb-6" style={{background:"linear-gradient(135deg, rgba(110,231,241,0.10), rgba(91,141,239,0.05))", border:"1px solid rgba(110,231,241,0.35)"}}>
        <div className="flex items-center gap-4">
          <div className="text-4xl">🛡️</div>
          <div>
            <div className="text-xs uppercase tracking-widest text-cyan-300 mb-1">Pilar 1</div>
            <h2 className="serif text-3xl text-cyan-100">Defenderse con IA</h2>
            <p className="text-sm text-slate-400 mt-1">Frente a los drones, drones: el arnés MDASH y el equipo de agentes especialistas</p>
          </div>
        </div>
      </div>
      <div className="card p-6 mb-4">
        <p className="text-slate-200 leading-relaxed">{PILLAR_DEFEND.text}</p>
        <blockquote className="mt-4 border-l-2 border-cyan-400 pl-4 text-slate-100 italic">{PILLAR_DEFEND.quote}</blockquote>
      </div>
      <h3 className="serif text-xl text-slate-100 mb-3">Los tres ingredientes</h3>
      <div className="grid md:grid-cols-3 gap-4 mb-6">
        {PILLAR_DEFEND.details.map((d, i) => (
          <div key={i} className="card p-5">
            <div className="serif text-2xl text-cyan-300 mb-2">{d.h.split(' — ')[0]}</div>
            <p className="text-slate-300 leading-relaxed text-[15px]">{d.b}</p>
          </div>
        ))}
      </div>
      <div className="card-2 p-5 mb-6">
        <div className="text-xs uppercase tracking-widest text-amber-300 mb-2">La estrategia en una frase</div>
        <div className="serif text-xl text-slate-100">{PILLAR_DEFEND.formula}</div>
      </div>
      <h3 className="serif text-xl text-slate-100 mb-3">El equipo de agentes especialistas</h3>
      <div className="grid md:grid-cols-4 gap-3 mb-6">
        <div className="card p-4">
          <Badge red>RED Team</Badge>
          <div className="text-slate-200 mt-3 text-sm">Pressure-test del estate. Red Team / Penetration Testing y Attack Path Agents.</div>
        </div>
        <div className="card p-4">
          <Badge blue>BLUE Team</Badge>
          <div className="text-slate-200 mt-3 text-sm">Detection Authoring, Incident Investigation, Threat Intelligence, Incident Triage, Data Classification, Threat Hunting.</div>
        </div>
        <div className="card p-4">
          <Badge green>GREEN Team</Badge>
          <div className="text-slate-200 mt-3 text-sm">Posture Management, Vulnerability Detection, Proactive Protection, Posture Remediation.</div>
        </div>
        <div className="card p-4">
          <Badge gold>Planner + Reviewer</Badge>
          <div className="text-slate-200 mt-3 text-sm">Planner — coordinador que decide qué agentes invocar. Reviewer/Critic — mantiene HITL para aprobaciones y QA.</div>
        </div>
      </div>
      <h3 className="serif text-xl text-slate-100 mb-3">El loop en acción</h3>
      <div className="card p-5 mb-6">
        <div className="text-slate-400 text-sm mb-4 italic">Escenario: el CEO envía un artículo de threat intelligence y pregunta «¿estamos protegidos?»</div>
        <ol className="space-y-3">
          {AGENT_LOOP.map((s, i) => (
            <li key={i} className="flex gap-3">
              <div className="num-dot text-slate-900 font-bold w-8 h-8 rounded-full flex items-center justify-center shadow-md flex-shrink-0">{s.n}</div>
              <div>
                <div className="font-semibold text-slate-100">{s.who}</div>
                <div className="text-slate-300 text-sm mt-0.5">{s.what}</div>
              </div>
            </li>
          ))}
        </ol>
        <div className="divider pt-4 mt-4 text-slate-300 italic">
          «Una pregunta que un SOC tardaba días en responder reactivamente — ahora se responde, se evidencia y se prueba en un bucle continuo. Proactivo. Preventivo. Persistente.»
        </div>
      </div>
      <h3 className="serif text-xl text-slate-100 mb-3">El nuevo rol — Frontier Security Engineer</h3>
      <div className="card p-6">
        <div className="grid md:grid-cols-3 gap-4 items-center">
          <div className="text-center card-2 p-4">
            <div className="text-3xl mb-2">🧑‍💼</div>
            <div className="font-semibold">Frontier Security Engineer</div>
            <div className="text-slate-400 text-sm mt-1">Nuevo rol. Opera y supervisa el equipo de agentes especialistas.</div>
          </div>
          <div className="text-center serif text-3xl text-cyan-300">+</div>
          <div className="text-center card-2 p-4">
            <div className="text-3xl mb-2">🧑‍💻</div>
            <div className="font-semibold">Security Analyst</div>
            <div className="text-slate-400 text-sm mt-1">El analista clásico, ahora con «superpoderes» agénticos.</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function TabGobierno() {
  return (
    <div>
      <div className="card-2 p-5 mb-6" style={{background:"linear-gradient(135deg, rgba(245,158,139,0.10), rgba(212,166,74,0.05))", border:"1px solid rgba(245,158,139,0.35)"}}>
        <div className="flex items-center gap-4">
          <div className="text-4xl">⚖️</div>
          <div>
            <div className="text-xs uppercase tracking-widest text-orange-300 mb-1">Pilar 2</div>
            <h2 className="serif text-3xl text-orange-100">Habilitar IA con gobierno</h2>
            <p className="text-sm text-slate-400 mt-1">De NONO y YOLO a GOGO</p>
          </div>
        </div>
      </div>
      <div className="card p-6 mb-4">
        <p className="text-slate-200 leading-relaxed">{PILLAR_SAFELY.text}</p>
        <blockquote className="mt-4 border-l-2 border-cyan-400 pl-4 text-slate-100 italic">{PILLAR_SAFELY.quote}</blockquote>
      </div>
      <h3 className="serif text-xl text-slate-100 mb-3">Mapa de riesgo por comportamiento del agente</h3>
      <div className="card overflow-hidden mb-6">
        <table className="w-full text-sm">
          <thead className="bg-slate-800/40 text-slate-300 text-left">
            <tr>
              <th className="px-4 py-3 font-medium">Comportamiento del agente</th>
              <th className="px-4 py-3 font-medium">Riesgo asociado</th>
            </tr>
          </thead>
          <tbody>
            {PILLAR_SAFELY.riskMap.map((r, i) => (
              <tr key={i} style={{borderTop: "1px solid var(--line)"}}>
                <td className="px-4 py-3 text-slate-200 font-medium">{r.behavior}</td>
                <td className="px-4 py-3 text-slate-300">{r.risk}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <h3 className="serif text-xl text-slate-100 mb-3">Los cuatro pasos</h3>
      <ol className="card p-5 space-y-3 mb-4">
        {PILLAR_SAFELY.steps.map((s, i) => (
          <li key={i} className="flex gap-3">
            <div className="num-dot text-slate-900 font-bold w-8 h-8 rounded-full flex items-center justify-center shadow-md flex-shrink-0">{i+1}</div>
            <div className="text-slate-300">{s}</div>
          </li>
        ))}
      </ol>
      <div className="card-2 p-5">
        <Badge green>GA — mayo 2026</Badge>
        <p className="text-slate-200 mt-3 leading-relaxed">{PILLAR_SAFELY.ga}</p>
      </div>
    </div>
  );
}

function TabDatos() {
  return (
    <div>
      <div className="card-2 p-5 mb-6" style={{background:"linear-gradient(135deg, rgba(72,187,120,0.10), rgba(110,231,241,0.05))", border:"1px solid rgba(72,187,120,0.35)"}}>
        <div className="flex items-center gap-4">
          <div className="text-4xl">🔐</div>
          <div>
            <div className="text-xs uppercase tracking-widest text-emerald-300 mb-1">Pilar 3</div>
            <h2 className="serif text-3xl text-emerald-100">Datos seguros, IA confiable</h2>
            <p className="text-sm text-slate-400 mt-1">No hay confianza en IA sin asegurar primero el dato</p>
          </div>
        </div>
      </div>
      <div className="card p-6 mb-4">
        <p className="text-slate-200 leading-relaxed">{PILLAR_TRUST.text}</p>
      </div>
      <div className="card-2 p-5 mb-4">
        <div className="text-xs uppercase tracking-widest text-amber-300 mb-2">El problema</div>
        <p className="text-slate-200 leading-relaxed">{PILLAR_TRUST.problem}</p>
      </div>
      <h3 className="serif text-xl text-slate-100 mb-3">Data Posture Agent</h3>
      <div className="card p-5 mb-4">
        <ul className="space-y-2 text-slate-200">
          {PILLAR_TRUST.solBullets.map((b, i) => <li key={i}>· {b}</li>)}
        </ul>
      </div>
      <h3 className="serif text-xl text-slate-100 mb-3">Inline DLP en Microsoft 365 Copilot</h3>
      <div className="card p-5 mb-4">
        <p className="text-slate-200 leading-relaxed">{PILLAR_TRUST.dlp}</p>
      </div>
      <h3 className="serif text-xl text-slate-100 mb-3">Respeto de sensitivity labels</h3>
      <div className="card p-5">
        <p className="text-slate-200 leading-relaxed">{PILLAR_TRUST.labels}</p>
      </div>
    </div>
  );
}

function TabBase() {
  return (
    <div>
      <div className="card-2 p-5 mb-6" style={{background:"linear-gradient(135deg, rgba(212,166,74,0.12), rgba(245,158,139,0.05))", border:"1px solid rgba(212,166,74,0.4)"}}>
        <div className="flex items-center gap-4">
          <div className="text-4xl">🏛️</div>
          <div>
            <div className="text-xs uppercase tracking-widest text-amber-300 mb-1">Base</div>
            <h2 className="serif text-3xl text-amber-100">Prepararse para la IA</h2>
            <p className="text-sm text-slate-400 mt-1">Si la IA está cerrando la ventana entre descubrimiento y explotación, la respuesta no es pánico: es postura</p>
          </div>
        </div>
      </div>
      <div className="card-2 p-5 mb-5">
        <div className="text-xs uppercase tracking-widest text-amber-300 mb-2">Los cinco fundamentales — aka.ms/securenow</div>
        <ul className="space-y-2 text-slate-200">
          {FOUNDATION_ITEMS.map((f, i) => <li key={i}>· {f}</li>)}
        </ul>
      </div>
      <div className="card p-5 text-slate-300 italic">
        «Ninguno de estos es una disciplina nueva — los llevan haciendo años. Lo nuevo es la presión de tiempo y la prescriptive guidance end-to-end que Microsoft ofrece en cada uno.»
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = React.useState('defensa');
  const imgUrl = "media/security-ai-speed-gladiator-v2.png";

  const tabs = [
    { id: 'defensa', icon: '🛡️', label: 'Defenderse con IA', border: 'border-cyan-400' },
    { id: 'gobierno', icon: '⚖️', label: 'Habilitar IA con gobierno', border: 'border-orange-400' },
    { id: 'datos', icon: '🔐', label: 'Datos seguros, IA confiable', border: 'border-emerald-400' },
    { id: 'base', icon: '🏛️', label: 'Prepararse para la IA', border: 'border-amber-400' },
  ];

  return (
    <div className="max-w-6xl mx-auto px-6 py-10">
      <ThemeToggle/>

      {/* HERO */}
      <header className="card overflow-hidden mb-10">
        <div className="grid lg:grid-cols-5 gap-0">
          <div className="lg:col-span-3 p-8 relative">
            <div className="absolute -right-16 -top-16 w-72 h-72 rounded-full" style={{background: "radial-gradient(circle, rgba(110,231,241,0.18), transparent 70%)"}}></div>
            <div className="flex flex-wrap items-center gap-2 mb-3 relative">
              <Badge>Microsoft Security</Badge>
            </div>
            <h1 className="serif text-4xl md:text-5xl leading-tight relative">Seguridad al ritmo de la IA</h1>
            <p className="text-slate-300 mt-4 text-lg leading-relaxed relative">
              La defensa empresarial ya no se mide contra atacantes humanos, sino contra <strong>agentes autónomos</strong> que reconocen, explotan y se mueven a mayor velocidad. La respuesta no es resistir más rápido: es <strong>reformular el SOC</strong> con un equipo de agentes que defienden en tiempo real, gobernado por un <i>arnés</i> multi-modelo, anclado en el dato del cliente y supervisado por un nuevo rol — el <em>Frontier Security Engineer</em>.
            </p>
            <blockquote className="mt-5 border-l-2 border-cyan-400 pl-4 text-slate-200 italic relative quote-mark">
              Los ataques liderados por humanos prueban si puedes responder lo bastante rápido. Los ataques liderados por agentes prueban si has dejado algo que se pueda explotar.
              <div className="text-slate-400 text-sm mt-2 not-italic">— Hayete Gallot, EVP Microsoft Security</div>
            </blockquote>
          </div>
          <div className="lg:col-span-2 relative">
            <img src={imgUrl} alt="Gladiador con casco MDASH, harness en X, tatuajes de modelos y escudo Microsoft Security" className="w-full h-full object-cover" style={{minHeight: "420px"}}/>
          </div>
        </div>
      </header>

      {/* 1 - IDEA */}
      <Collapsible n="1" title="La idea en una frase">
        <div className="card p-6">
          <p className="text-lg text-slate-100 leading-relaxed">
            <strong>La seguridad al ritmo de la IA</strong> es el principio de que la defensa empresarial tiene que ser <strong>autónoma, continua y orquestada por agentes</strong>, porque ya no compite contra humanos: compite contra agentes adversarios que ejecutan el <Term t="kill chain" d="cadena de ataque completa, desde reconocimiento hasta exfiltración"/> a una mayor velocidad.
          </p>
        </div>
      </Collapsible>

      {/* 2 - POR QUÉ IMPORTA */}
      <Collapsible n="2" title="Por qué importa" sub="BLUF (Bottom Line Up Front — la conclusión primero)">
        <div className="card p-6 text-slate-200 leading-relaxed space-y-4">
          <p>
            La ventana entre el <strong>descubrimiento</strong> de una vulnerabilidad y su <strong>explotación</strong> se ha reducido. Antes había días o semanas para parchear; hoy se explota en minutos por una cadena de agentes coordinados. La curva del riesgo se rompió: no es ya proyectable desde la anterior, es una <Term t="step-function" d="cambio escalonado y discontinuo, no incremental"/>.
          </p>
          <p>
            La consecuencia operativa es directa: el moat tradicional — perímetros, firewalls, EDR puntuales — sigue siendo necesario, pero insuficiente. Sobre él hay que construir una arquitectura agéntica que opere 24/7, capaz de razonar sobre el estado completo del cliente en segundos.
          </p>
        </div>
      </Collapsible>

      {/* 3 - CASOS REALES */}
      <Collapsible n="3" title="Casos reales de ejemplo" sub="Tres ejemplos de incidentes anonimizados — todos basados en hechos públicos">
        <div className="grid gap-4">
          {REAL_CASES.map((c, i) => <CaseCard key={i} c={c}/>)}
        </div>
        <div className="card-2 p-5 mt-4">
          <h3 className="serif text-lg text-cyan-200 mb-2">El kill chain agéntico de Octo Tempest</h3>
          <div className="grid md:grid-cols-4 gap-3 text-sm">
            {[
              {n: "Vulnerability Finder Agent", d: "Localiza debilidades"},
              {n: "Reconnaissance Agent", d: "Mapea el entorno"},
              {n: "Lateral Movement Agent", d: "Pivota una vez dentro"},
              {n: "C2 Agent", d: "Command & Control — sincroniza al resto"},
            ].map((x, i) => (
              <div key={i} className="card-2 p-3" style={{background:"rgba(192,57,43,0.08)", border:"1px solid rgba(192,57,43,0.25)"}}>
                <div className="font-semibold text-red-200">{x.n}</div>
                <div className="text-slate-400 text-xs mt-1">{x.d}</div>
              </div>
            ))}
          </div>
          <div className="text-slate-400 text-sm mt-4 italic">«Los atacantes solían atacar una empresa cada vez. Ahora pueden atacar 50 simultáneamente, más rápido de lo que cualquier SOC humano puede responder. Ese es el nuevo kill chain.»</div>
        </div>
      </Collapsible>

      {/* 4 - CINCO CAMBIOS */}
      <Collapsible n="4" title="Los cinco cambios estructurales" sub="Qué hay que interiorizar antes de discutir herramientas">
        <div className="grid md:grid-cols-2 gap-4">
          {FIVE_CHANGES.map((c, i) => (
            <div key={i} className="card p-5">
              <div className="flex items-start gap-3">
                <div className="text-3xl serif text-cyan-300/80 leading-none">{String(i+1).padStart(2,"0")}</div>
                <div>
                  <h3 className="font-semibold text-slate-100">{c.t}</h3>
                  <p className="text-slate-300 mt-1.5 leading-relaxed">{c.d}</p>
                </div>
              </div>
            </div>
          ))}
        </div>
      </Collapsible>

      {/* 5 - FRAMEWORK como tabs */}
      <Collapsible n="5" title="El framework — tres pilares y una base" sub="Pulsa cada caja para ver su contenido">
        <div className="card-2 p-6 mb-4">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3 text-center">
            {tabs.map(t => (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                className={"card p-4 w-full focus:outline-none transition border-2 " + (tab === t.id ? t.border + " bg-slate-900/40" : "border-transparent")}
              >
                <div className="pillar-icon mb-2">{t.icon}</div>
                <div className="font-semibold text-cyan-200">{t.label}</div>
              </button>
            ))}
          </div>
          <div className="mt-6">
            {tab === 'defensa' && <TabDefensa/>}
            {tab === 'gobierno' && <TabGobierno/>}
            {tab === 'datos' && <TabDatos/>}
            {tab === 'base' && <TabBase/>}
          </div>
        </div>
      </Collapsible>

      {/* HARNESS */}
      <Collapsible n="6" title="Vulnerability Scanning Harness — descubrimiento autónomo de vulnerabilidades" sub="Sistema multi-agente · 100+ agentes especialistas · 4 fases en bucle cerrado · Multi-modelo · Private Preview">
        <div className="card p-6 mb-4">
          <p className="text-slate-200 leading-relaxed">
            <strong>Team Atlanta</strong> — ganadores del <strong>DARPA AI Cyber Challenge Finals</strong> (DEF CON 33) con premio top de 4 M USD — pasaron a Microsoft Security liderados por <strong>Taesoo Kim</strong>. Lo que están construyendo es un sistema multi-agente para descubrimiento autónomo de vulnerabilidades en código, en bucle cerrado <strong>Descubrir → Validar → Probar → Corregir</strong>.
          </p>
          <p className="text-slate-300 mt-3 leading-relaxed text-sm italic">
            La promesa: pasar de point tools a un sistema continuo y agent-driven. No sólo encontrar issues, sino probarlos con evidencia reproducible. Multi-model by design. Integrado en Microsoft Defender para impulsar parches y detecciones.
          </p>
        </div>
        <div className="grid md:grid-cols-4 gap-3">
          {HARNESS_PHASES.map((p, i) => (
            <div key={i} className="card p-5">
              <Badge red={p.color==="red"} blue={p.color==="blue"} green={p.color==="green"} warm={p.color==="warm"} gold={p.color==="gold"}>{p.phase}</Badge>
              <div className="serif text-3xl text-slate-100 mt-3">{p.agents} <span className="text-base text-slate-400">agentes</span></div>
              <div className="text-slate-300 text-sm mt-2 leading-relaxed">{p.desc}</div>
            </div>
          ))}
        </div>
        <div className="card-2 p-5 mt-4">
          <div className="text-xs uppercase tracking-widest text-amber-300 mb-2">Modelos que potencian el harness</div>
          <div className="flex flex-wrap gap-2">
            <Badge gold>Claude (Anthropic)</Badge>
            <Badge gold>OpenAI</Badge>
            <Badge gold>OSS — Open-Source Software</Badge>
          </div>
          <div className="text-slate-400 text-xs mt-3 italic">Diseño multi-modelo: cada fase usa el modelo más adecuado, y el sistema mejora a medida que mejoran los modelos.</div>
        </div>
      </Collapsible>

      {/* TAKEAWAY */}
      <Collapsible n="7" title="El takeaway que conviene memorizar">
        <div className="card p-8 text-center" style={{background:"linear-gradient(135deg, rgba(110,231,241,0.08), rgba(192,57,43,0.06))"}}>
          <blockquote className="serif text-2xl text-slate-100 leading-relaxed italic">
            «Los ataques liderados por humanos prueban si puedes responder lo bastante rápido.<br/>
            Los ataques liderados por agentes prueban si has dejado algo que se pueda explotar.»
          </blockquote>
          <div className="text-slate-400 mt-4">— Hayete Gallot, EVP Microsoft Security · EMEA Security Days · mayo 2026</div>
        </div>
      </Collapsible>

      {/* GLOSARIO */}
      <Collapsible n="8" title="Glosario" sub="Todos los acrónimos y términos técnicos usados en esta página" defaultOpen={false}>
        <div className="card p-5">
          <dl className="grid md:grid-cols-2 gap-x-8 gap-y-3">
            {GLOSARIO.map((g, i) => (
              <div key={i} className="flex gap-3">
                <dt className="text-cyan-300 font-semibold whitespace-nowrap min-w-fit">{g.t}</dt>
                <dd className="text-slate-300 text-sm">{g.d}</dd>
              </div>
            ))}
          </dl>
        </div>
      </Collapsible>

      <footer className="text-slate-500 text-xs mt-12 pt-6 divider">
        <div className="flex flex-wrap items-center justify-between gap-3">
          <div>Seguridad al ritmo de la IA · Microsoft Security · Mayo 2026.</div>
          <div className="no-print">
            <a href="#" onClick={(e)=>{e.preventDefault();window.print();}}>🖨 Imprimir</a>
          </div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
